version: '3.8'
services:
  api:
    image: clpter/opencutter:api-latest
    pull_policy: always
    container_name: opencutter-api
    ports:
      - "${API_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"


  website:
    image: clpter/opencutter:website-latest
    pull_policy: always
    container_name: opencutter-website
    ports:
      - "${WEBSITE_HOST:-127.0.0.1}:${WEBSITE_PORT:-80}:80"
    depends_on:
      - api
