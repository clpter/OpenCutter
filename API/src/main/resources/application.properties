spring.application.name=opencutter-api
server.port=${API_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

# Read real client IP
server.forward-headers-strategy=framework

# Rate limiting configuration (requests per minute per IP)
api.rate-limit.max-requests-per-minute=20

# Reject oversized payloads before consuming memory
server.tomcat.max-http-form-post-size=250KB
